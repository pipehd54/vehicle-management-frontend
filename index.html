<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Taller Mecánico - Sistema de Mantenimiento</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- NAVEGACIÓN SUPERIOR -->
    <nav class="navbar">
        <div class="brand">
            <svg class="icon-svg brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
            </svg>
            <span>Taller Mecánico</span>
        </div>
        <div class="user-status" id="user-status-bar">
            <!-- Renderizado dinámico desde app.js -->
        </div>
    </nav>

    <main class="container">

        <!-- PANEL DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
        <section id="auth-panel" class="panel auth-card">
            <div class="panel-header">
                <h2 class="panel-title" id="auth-title">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                    </svg>
                    <span>Iniciar Sesión</span>
                </h2>
                <button type="button" class="btn btn-secondary" id="toggle-auth-btn" onclick="toggleAuthMode()">
                    ¿No tienes cuenta? Regístrate
                </button>
            </div>
            
            <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                <div class="form-grid single-col">
                    <div class="form-group">
                        <label for="auth-email">Correo Electrónico</label>
                        <input type="email" id="auth-email" class="form-control" placeholder="mecanico@taller.com" required>
                    </div>
                    <div class="form-group">
                        <label for="auth-password">Contraseña</label>
                        <input type="password" id="auth-password" class="form-control" placeholder="••••••••" required minlength="8" maxlength="50">
                    </div>
                    <div class="form-group hidden" id="role-group">
                        <label for="auth-role">Rol de Usuario</label>
                        <select id="auth-role" class="form-control">
                            <option value="mecanico">Mecánico</option>
                            <option value="administrador">Administrador</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-full" id="auth-submit-btn">Ingresar al Taller</button>
                </div>
            </form>
        </section>

        <!-- DASHBOARD Y GESTIÓN DE VEHÍCULOS (Visible solo si autenticado) -->
        <section id="app-panel" class="hidden">
            
            <!-- PANEL: REGISTRAR VEHÍCULO -->
            <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="1" y="3" width="15" height="13"></rect>
                            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                            <circle cx="5.5" cy="18.5" r="2.5"></circle>
                            <circle cx="18.5" cy="18.5" r="2.5"></circle>
                        </svg>
                        <span>Registrar Nuevo Vehículo</span>
                    </h3>
                </div>
                <form id="vehicle-form" onsubmit="handleCreateVehicle(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="v-tipo">Tipo de Vehículo</label>
                            <select id="v-tipo" class="form-control">
                                <option value="carro">Carro</option>
                                <option value="motocicleta">Motocicleta</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="v-placa">Placa</label>
                            <input type="text" id="v-placa" class="form-control" placeholder="ABC-123" required minlength="3" maxlength="20">
                        </div>
                        <div class="form-group">
                            <label for="v-marca">Marca</label>
                            <input type="text" id="v-marca" class="form-control" placeholder="Hero, Toyota, etc." required minlength="2" maxlength="50">
                        </div>
                        <div class="form-group">
                            <label for="v-modelo">Modelo</label>
                            <input type="text" id="v-modelo" class="form-control" placeholder="Eco 100, Corolla, etc." required minlength="1" maxlength="50">
                        </div>
                        <div class="form-group">
                            <label for="v-km">Kilometraje Actual</label>
                            <div class="input-group">
                                <input type="number" id="v-km" class="form-control" placeholder="2500" min="0">
                                <span class="input-addon">km</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="v-fecha-compra">Fecha de Compra (Opcional)</label>
                            <input type="date" id="v-fecha-compra" class="form-control">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Registrar Vehículo</button>
                    </div>
                </form>
            </div>

            <!-- PANEL: EDITAR VEHÍCULO (Oculto por defecto) -->
            <div class="panel hidden" id="edit-vehicle-panel">
                <div class="panel-header">
                    <h3 class="panel-title" id="edit-vehicle-title">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                        <span>Editar Vehículo</span>
                    </h3>
                    <button type="button" class="btn btn-secondary" onclick="cerrarEditarVehiculo()">Cancelar</button>
                </div>
                <form id="edit-vehicle-form" onsubmit="handleUpdateVehicle(event)">
                    <input type="hidden" id="ev-id">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="ev-tipo">Tipo de Vehículo</label>
                            <select id="ev-tipo" class="form-control">
                                <option value="carro">Carro</option>
                                <option value="motocicleta">Motocicleta</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="ev-placa">Placa</label>
                            <input type="text" id="ev-placa" class="form-control" required minlength="3" maxlength="20">
                        </div>
                        <div class="form-group">
                            <label for="ev-marca">Marca</label>
                            <input type="text" id="ev-marca" class="form-control" required minlength="2" maxlength="50">
                        </div>
                        <div class="form-group">
                            <label for="ev-modelo">Modelo</label>
                            <input type="text" id="ev-modelo" class="form-control" required minlength="1" maxlength="50">
                        </div>
                        <div class="form-group">
                            <label for="ev-km">Kilometraje Actual</label>
                            <div class="input-group">
                                <input type="number" id="ev-km" class="form-control" min="0">
                                <span class="input-addon">km</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="ev-fecha-compra">Fecha de Compra (Opcional)</label>
                            <input type="date" id="ev-fecha-compra" class="form-control">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>

            <!-- PANEL: LISTA DE VEHÍCULOS -->
            <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                        <span>Vehículos Registrados</span>
                    </h3>
                    <button class="btn btn-secondary" onclick="cargarVehiculos()">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                        <span>Recargar</span>
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tipo</th>
                                <th>Placa</th>
                                <th>Marca y Modelo</th>
                                <th>Km Actual</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="vehicles-tbody">
                            <!-- Filas insertadas dinámicamente -->
                        </tbody>
                    </table>
                </div>

                <div class="pagination">
                    <button class="btn btn-secondary" id="prev-page-btn" onclick="cambiarPagina(-1)" disabled>Anterior</button>
                    <span id="page-indicator" style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">Página 1</span>
                    <button class="btn btn-secondary" id="next-page-btn" onclick="cambiarPagina(1)">Siguiente</button>
                </div>
            </div>

            <!-- PANEL: MANTENIMIENTOS DEL VEHÍCULO SELECCIONADO -->
            <div class="panel hidden" id="maintenance-section">
                <div class="panel-header">
                    <h3 class="panel-title" id="maintenance-title">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                        </svg>
                        <span id="maintenance-title-text">Mantenimientos</span>
                    </h3>
                    <button class="btn btn-secondary" onclick="cerrarMantenimientos()">Cerrar</button>
                </div>

                <!-- BANNER: PRÓXIMO MANTENIMIENTO RECOMENDADO -->
                <div id="recommendation-banner" class="recommendation-box hidden" style="margin-bottom: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                        <div>
                            <h4 style="color: var(--accent); display: flex; align-items: center; gap: 0.5rem; font-size: 1.05rem; margin-bottom: 0.25rem;">
                                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
                                </svg>
                                <span>Próximo Mantenimiento Recomendado</span>
                            </h4>
                            <p id="rec-description" style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5;"></p>
                        </div>
                        <button class="btn btn-primary" onclick="usarMantenimientoSugerido()">
                            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span>Cargar Recomendación</span>
                        </button>
                    </div>
                </div>

                <!-- FORMULARIO CREAR MANTENIMIENTO -->
                <form id="maintenance-form" onsubmit="handleCreateMaintenance(event)" style="margin-bottom: 2rem;">
                    <input type="hidden" id="m-vehiculo-id">
                    <div class="form-grid">
                        <div class="form-group col-span-2">
                            <label for="m-descripcion">Descripción del trabajo</label>
                            <input type="text" id="m-descripcion" class="form-control" placeholder="Cambio de aceite, filtro y revisión de frenos" required minlength="5" maxlength="500">
                        </div>
                        <div class="form-group">
                            <label for="m-estado">Estado Inicial</label>
                            <select id="m-estado" class="form-control">
                                <option value="pendiente">Pendiente</option>
                                <option value="en_proceso">En Proceso</option>
                                <option value="completado">Completado</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="m-costo">Costo Estimado</label>
                            <div class="input-group">
                                <input type="number" id="m-costo" class="form-control" placeholder="120000" min="0">
                                <span class="input-addon">COP</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="m-km">Kilometraje Objetivo</label>
                            <div class="input-group">
                                <input type="number" id="m-km" class="form-control" placeholder="3000" min="0">
                                <span class="input-addon">km</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="m-fecha-programada">Fecha Programada (Manual u Opcional)</label>
                            <input type="date" id="m-fecha-programada" class="form-control">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Agregar Mantenimiento</button>
                    </div>
                </form>

                <!-- TABLA DE MANTENIMIENTOS -->
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Descripción</th>
                                <th>Estado</th>
                                <th>Costo</th>
                                <th>Km</th>
                                <th>Fecha Programada</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="maintenances-tbody">
                            <!-- Filas insertadas dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>

    </main>

    <!-- NOTIFICACIONES TOAST -->
    <div id="toast-container"></div>

    <!-- SCRIPTS -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
